name: Build VoidX Flasher (Windows)
on:
  push:
    paths:
      - 'tools/flasher/**'
      - '.github/workflows/flasher.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: python -m pip install esptool==4.8.1 pyserial==3.5 pyinstaller==6.11.1
      - name: Prova rapida (logica, senza pedale)
        working-directory: tools/flasher
        run: python -c "import importlib.util as u; s=u.spec_from_file_location('vf','voidx_flasher.pyw'); m=u.module_from_spec(s); s.loader.exec_module(m); import esptool; print('ok', esptool.__version__)"
      - name: Compila un unico .exe
        working-directory: tools/flasher
        run: pyinstaller --noconfirm --onefile --windowed --name VoidX-Flasher --collect-all esptool --hidden-import serial.tools.list_ports voidx_flasher.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: VoidX-Flasher-exe
          path: tools/flasher/dist/VoidX-Flasher.exe
      - name: Pubblica come release "flasher"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete flasher -y --cleanup-tag || true
          gh release create flasher tools/flasher/dist/VoidX-Flasher.exe --title "VoidX Flasher (Windows)" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}. Un solo file: niente da installare."
